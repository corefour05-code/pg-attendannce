<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Scanner - PG Hostel Attendance</title>
<link rel="stylesheet" href="/static/design-system.css" />
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<style>
  body { background: #F8FAFC; height: auto; min-height: 100vh; }

  .scanner-topbar {
    background: var(--white);
    border-bottom: 3px solid var(--primary-blue);
    box-shadow: var(--box-shadow);
    padding: 1rem 3rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .scanner-topbar .wordmark { display: flex; align-items: center; gap: 0.6rem; font-weight: 700; font-size: 1.1rem; }
  .scanner-topbar .wordmark i { color: var(--primary-blue); font-size: 1.5rem; }
  .topbar-actions { display: flex; gap: 0.75rem; }

  .scanner-body { display: flex; gap: 2rem; padding: 2rem; align-items: flex-start; }
  .scanner-left { flex: 0 0 42%; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .scanner-right { flex: 1; min-width: 0; }

  .gate-heading { font-size: 1.3rem; margin-bottom: 1rem; }
  .gate-heading .hostel-name { color: var(--primary-blue); text-transform: uppercase; }

  .status-banner {
    width: 100%; max-width: 900px;
    background: var(--white);
    border-radius: var(--border-radius);
    box-shadow: var(--box-shadow);
    border-left: 8px solid #ccc;
    padding: 1.25rem;
    font-size: 1.5rem;
    font-weight: 700;
    text-align: center;
    margin-bottom: 1.25rem;
    transition: border-color 0.2s ease, color 0.2s ease;
  }
  .status-banner.tracking { border-left-color: var(--danger); color: var(--danger); }
  .status-banner.recognized-in { border-left-color: var(--success); color: var(--success); }
  .status-banner.recognized-out { border-left-color: #ea580c; color: #ea580c; }
  .status-banner.cooldown { border-left-color: #f59e0b; color: #b45309; font-size: 1.2rem; }

  .camera-card {
    width: 100%; max-width: 850px; aspect-ratio: 4/3;
    background: #000;
    border-radius: var(--border-radius);
    border: 4px solid var(--white);
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    display: flex; align-items: center; justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .camera-card video { width: 100%; height: 100%; object-fit: cover; display: none; }
  .camera-card canvas#scanner-overlay {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }
  .camera-placeholder { color: rgba(255,255,255,0.5); text-align: center; }
  .camera-placeholder i { font-size: 4rem; display: block; margin-bottom: 0.5rem; }

  .recognized-popup {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -40%) scale(0.9);
    background: rgba(19, 158, 81, 0.95);
    color: #fff;
    padding: 1.2rem 2.2rem;
    border-radius: 12px;
    font-size: 1.5rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 0.8rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    z-index: 5;
    white-space: nowrap;
  }
  .recognized-popup.visible { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .recognized-popup i { font-size: 2rem; }

  .track-btn {
    margin-top: 1.5rem;
    padding: 1rem 2.5rem;
    border-radius: 999px;
    font-size: 1.05rem;
    font-weight: 700;
    box-shadow: 0 6px 18px rgba(0,0,0,0.2);
    border: none;
    cursor: pointer;
  }
  .track-btn.start { background: var(--primary-blue); color: #fff; }
  .track-btn.stop { background: var(--danger); color: #fff; }

  .logs-card { background: var(--white); border-radius: var(--border-radius); box-shadow: var(--box-shadow); padding: 1.5rem; }
  .logs-header { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 1rem; font-weight: 600; }
  .today-count-badge { margin-left: auto; background: var(--primary-blue); color: #fff; font-size: 0.85rem; font-weight: 700; padding: 0.25rem 0.75rem; border-radius: 999px; }
  .live-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--success); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  .logs-scroll { overflow-x: auto; max-height: 520px; }
  .logs-scroll table { white-space: nowrap; width: 100%; border-collapse: collapse; }
  .logs-scroll th, .logs-scroll td { padding: 0.65rem 0.85rem; }
  
  .badge-direction-out { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; font-weight: 700; padding: 0.2rem 0.6rem; border-radius: 6px; font-size: 0.8rem; }
  .badge-direction-in { background: #dcfce7; color: #15803d; border: 1px solid #86efac; font-weight: 700; padding: 0.2rem 0.6rem; border-radius: 6px; font-size: 0.8rem; }
  
  .empty-state { text-align: center; color: var(--text-muted); padding: 2rem; }

  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(15,20,25,0.6);
    backdrop-filter: blur(4px);
    align-items: center; justify-content: center;
    z-index: 50;
  }
  .modal-overlay.open { display: flex; }
  .modal-panel {
    background: var(--white);
    border-radius: var(--border-radius);
    padding: 2rem;
    max-width: 400px;
    width: 100%;
    text-align: center;
  }
  .modal-actions { display: flex; gap: 1rem; margin-top: 1.5rem; }
  .modal-actions .btn { flex: 1; }
</style>
</head>
<body>
  <div class="scanner-topbar">
    <div class="wordmark"><i class="ph ph-shield-check"></i><span>PG HOSTEL ATTENDANCE</span></div>
    <div class="topbar-actions">
      <button class="btn btn-danger" id="clear-gate-btn"><i class="ph ph-user-minus"></i>Clear Gate</button>
      <a class="btn btn-primary" href="/logout"><i class="ph ph-sign-out"></i>Logout</a>
    </div>
  </div>

  <div class="scanner-body">
    <div class="scanner-left">
      <h2 class="gate-heading">Face Attendance - <span class="hostel-name">{{ hostel_name }}</span></h2>

      <div class="status-banner" id="status-banner">Name: waiting ...</div>

      <div class="camera-card">
        <video id="scanner-video" autoplay playsinline muted></video>
        <canvas id="scanner-overlay"></canvas>
        <div class="recognized-popup" id="recognized-popup">
          <i class="ph ph-check-circle" id="popup-icon"></i>
          <span id="recognized-popup-name"></span>
        </div>
        <div class="camera-placeholder" id="camera-placeholder">
          <i class="ph ph-video-camera-slash"></i>
          <div>CAMERA DISCONNECTED</div>
        </div>
      </div>

      <button class="track-btn start" id="track-btn">&#9654; Start Tracking</button>
    </div>

    <div class="scanner-right">
      <div class="logs-card">
        <div class="logs-header">
          <span class="live-dot"></span><span>Today's All Movement Logs</span>
          <span class="today-count-badge" id="today-count-badge">0 today</span>
        </div>
        <div class="logs-scroll">
          <table id="logs-table">
            <thead>
              <tr>
                <th>S.No</th><th>Type</th><th>ID</th><th>Name</th><th>Room No</th>
                <th>Movement</th><th>Time</th><th>Date</th>
              </tr>
            </thead>
            <tbody><tr><td colspan="8" class="empty-state">Waiting for system start...</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="clear-modal">
    <div class="modal-panel">
      <h3>Clear All Persons?</h3>
      <p style="color: var(--text-muted);">This marks everyone currently inside as OUT.</p>
      <input type="password" id="clear-password" class="form-control" placeholder="Gate password" />
      <div class="modal-actions">
        <button class="btn btn-primary" id="clear-confirm-btn">Confirm Clear</button>
        <button class="btn btn-outline" id="clear-cancel-btn">Cancel</button>
      </div>
    </div>
  </div>

<script>
const video = document.getElementById('scanner-video');
const placeholder = document.getElementById('camera-placeholder');
const trackBtn = document.getElementById('track-btn');
const statusBanner = document.getElementById('status-banner');
const overlay = document.getElementById('scanner-overlay');
const popup = document.getElementById('recognized-popup');
const popupName = document.getElementById('recognized-popup-name');
const popupIcon = document.getElementById('popup-icon');
const canvas = document.createElement('canvas');

const POLL_GAP_MS = 150;
const POPUP_DURATION_MS = 2500;
const UNKNOWN_ALERT_COOLDOWN_MS = 4000;
const COOLDOWN_BANNER_DURATION_MS = 1500;

let tracking = false;
let locked = false;
let scanScheduled = null;
let unlockTimer = null;
let logsTimer = null;
let unknownAlertActive = false;
let lastAnnouncedPerson = null;
let lastAnnouncedTime = 0;

function drawBoxes(faces) {
  overlay.width = video.videoWidth || 640;
  overlay.height = video.videoHeight || 480;
  const ctx = overlay.getContext('2d');
  ctx.clearRect(0, 0, overlay.width, overlay.height);
  ctx.lineWidth = 3;
  ctx.font = '18px sans-serif';
  for (const f of (faces || [])) {
    const [x1, y1, x2, y2] = f.bbox;
    const known = f.identity !== 'unknown';
    ctx.strokeStyle = known ? '#21e378' : '#DC3545';
    ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
    const prefix = f.kind === 'staff' ? (f.role === 'security' ? 'Security:' : 'Warden:') : '';
    const label = known ? `${prefix}${f.identity} (${f.confidence.toFixed(2)})` : 'unknown';
    ctx.fillStyle = known ? '#21e378' : '#DC3545';
    ctx.fillText(label, x1, Math.max(16, y1 - 8));
  }
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = 1;
  utter.pitch = 1;
  window.speechSynthesis.speak(utter);
}

function showRecognizedPopup(name, status) {
  const isOut = status.toLowerCase() === 'out';
  const label = isOut ? 'OUT' : 'IN';
  popupName.textContent = `${name} - ${label}`;
  popup.style.background = isOut ? 'rgba(234, 88, 12, 0.95)' : 'rgba(19, 158, 81, 0.95)';
  popupIcon.className = isOut ? 'ph ph-arrow-circle-up-right' : 'ph ph-arrow-circle-down-left';
  popup.classList.add('visible');
  
  statusBanner.textContent = `Name: ${name} - Marked ${label}`;
  statusBanner.className = isOut ? 'status-banner recognized-out' : 'status-banner recognized-in';
  speak(`${name} ${label}`);
}

function showCooldownNotice(name, status, remaining) {
  const label = status.toUpperCase();
  statusBanner.textContent = `${name} - Already marked ${label} (Cooldown: ${remaining}s remaining)`;
  statusBanner.className = 'status-banner cooldown';
}

function announceUnknown() {
  if (unknownAlertActive) return;
  unknownAlertActive = true;
  speak('Unknown');
  setTimeout(() => { unknownAlertActive = false; }, UNKNOWN_ALERT_COOLDOWN_MS);
}

function hideRecognizedPopup() {
  popup.classList.remove('visible');
  drawBoxes([]);
  statusBanner.textContent = 'Name: waiting ...';
  statusBanner.className = tracking ? 'status-banner tracking' : 'status-banner';
}

async function scanTick() {
  if (!tracking || locked) return;
  canvas.width = video.videoWidth || 640;
  canvas.height = video.videoHeight || 480;
  canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
  const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', 0.85));
  const formData = new FormData();
  formData.append('image', blob, 'frame.jpg');
  try {
    const res = await fetch('/api/scan', { method: 'POST', body: formData });
    const data = await res.json();
    if (locked) return;
    drawBoxes(data.faces);
    
    if (data.name) {
      if (data.marked) {
        // Fresh movement event successfully logged!
        locked = true;
        showRecognizedPopup(data.name, data.status || 'out');
        refreshLogs();
        unlockTimer = setTimeout(() => {
          locked = false;
          hideRecognizedPopup();
        }, POPUP_DURATION_MS);
      } else if (data.cooldown) {
        // Debounce: person standing in front of camera within 1-minute window
        showCooldownNotice(data.name, data.status, data.remaining);
      }
    } else {
      statusBanner.textContent = 'Name: waiting ...';
      statusBanner.className = 'status-banner tracking';
      if ((data.faces || []).some((f) => f.identity === 'unknown')) {
        announceUnknown();
      }
    }
  } catch (e) {
    // transient network error
  }
}

function scheduleNextScan() {
  if (!tracking) return;
  scanTick().finally(() => {
    if (tracking) scanScheduled = setTimeout(scheduleNextScan, POLL_GAP_MS);
  });
}

async function refreshLogs() {
  try {
    const res = await fetch('/api/scanner/logs');
    const data = await res.json();
    document.getElementById('today-count-badge').textContent = `${data.count || 0} today`;
    const tbody = document.querySelector('#logs-table tbody');
    if (!data.rows || !data.rows.length) {
      tbody.innerHTML = '<tr><td colspan="8" class="empty-state">No movements logged today yet.</td></tr>';
      return;
    }
    tbody.innerHTML = data.rows.map((r, i) => {
      const isOut = (r.direction || '').toUpperCase() === 'OUT';
      const badgeClass = isOut ? 'badge-direction-out' : 'badge-direction-in';
      const directionLabel = isOut ? '▲ OUT' : '▼ IN';
      const kindLabel = r.kind === 'resident' ? 'Resident' : 'Staff';
      return `
        <tr>
          <td>${i + 1}</td>
          <td><span class="badge ${r.kind === 'resident' ? 'badge-blue' : 'badge-purple'}">${kindLabel}</span></td>
          <td><code>${r.person_id || '-'}</code></td>
          <td style="font-weight:600; color:var(--primary-blue);">${r.name}</td>
          <td>${r.room_no || '-'}</td>
          <td><span class="${badgeClass}">${directionLabel}</span></td>
          <td style="font-weight:600;">${r.punch_time_12 || r.punch_time}</td>
          <td style="color:var(--text-muted);">${r.punch_date || '-'}</td>
        </tr>
      `;
    }).join('');
  } catch (e) { /* keep last known rows */ }
}

trackBtn.addEventListener('click', async () => {
  if (!tracking) {
    speak('Scanner started');
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 }, audio: false });
    video.srcObject = stream;
    video.style.display = 'block';
    placeholder.style.display = 'none';
    tracking = true;
    trackBtn.textContent = '⏹ Stop System';
    trackBtn.classList.remove('start');
    trackBtn.classList.add('stop');
    statusBanner.className = 'status-banner tracking';
    scheduleNextScan();
    logsTimer = setInterval(refreshLogs, 3000);
    refreshLogs();
  } else {
    tracking = false;
    locked = false;
    clearTimeout(scanScheduled);
    clearTimeout(unlockTimer);
    clearInterval(logsTimer);
    popup.classList.remove('visible');
    if (video.srcObject) video.srcObject.getTracks().forEach((t) => t.stop());
    video.srcObject = null;
    video.style.display = 'none';
    placeholder.style.display = 'block';
    overlay.getContext('2d').clearRect(0, 0, overlay.width, overlay.height);
    trackBtn.textContent = '▶ Start Tracking';
    trackBtn.classList.remove('stop');
    trackBtn.classList.add('start');
    statusBanner.textContent = 'Name: waiting ...';
    statusBanner.className = 'status-banner';
  }
});

const clearModal = document.getElementById('clear-modal');
document.getElementById('clear-gate-btn').addEventListener('click', () => clearModal.classList.add('open'));
document.getElementById('clear-cancel-btn').addEventListener('click', () => clearModal.classList.remove('open'));
document.getElementById('clear-confirm-btn').addEventListener('click', async () => {
  const password = document.getElementById('clear-password').value;
  const res = await fetch('/api/scanner/clear', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: `password=${encodeURIComponent(password)}`,
  });
  const data = await res.json();
  if (data.ok) {
    clearModal.classList.remove('open');
    document.getElementById('clear-password').value = '';
    refreshLogs();
  } else {
    alert(data.error || 'Failed to clear gate.');
  }
});

refreshLogs();
</script>
</body>
</html>
