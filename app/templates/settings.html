{% extends "base_admin.html" %}
{% block title %}Settings{% endblock %}
{% block content %}
<div class="card" style="max-width:500px;">
  <h2 style="display:flex; align-items:center; gap:0.5rem;"><i class="ph ph-lock"></i>Settings</h2>
  <p style="color: var(--text-muted);">
    The gate password is required to mark everyone as "OUT" from the Scanner page's Clear Gate button.
  </p>
  <form method="post" action="/settings" style="display:grid; gap:0.9rem;">
    <label>Hostel Name
      <input type="text" name="hostel_name" class="form-control" value="{{ settings.hostel_name if settings else '' }}" />
    </label>
    <label>Gate Password
      <input type="text" name="gate_password" class="form-control" value="{{ settings.gate_password if settings else '' }}" />
    </label>
    <button type="submit" class="btn btn-primary">Save</button>
  </form>
</div>
{% endblock %}
